<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 샘플 · 수학 배틀</title>
<style>
  :root { --bg: #0f1422; --card: #1d2640; --line: #2c3758; --text: #e8ecf8; --muted: #95a0bf; --accent: #ffcc4d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% -10%, #1f2a4a, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; min-height: 100vh; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 6px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .92rem; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .card h2 small { color: var(--muted); font-weight: 500; font-size: .8rem; }
  .stage { height: 230px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(#26304f, #1a2138); position: relative; overflow: hidden; }
  .stage svg { width: 200px; height: 233px; overflow: visible; }
  .btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  button { font: inherit; color: var(--text); background: #26304f; border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; cursor: pointer; font-size: .82rem; }
  button:hover { border-color: #4a5a8a; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .colors { display: flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
  .colors i { width: 22px; height: 22px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; }
  .colors i.on { border-color: #fff; }
  .note { color: var(--muted); font-size: .8rem; line-height: 1.45; margin: 0; }
  section.board-sec { margin-top: 18px; }
  section.board-sec h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
  .board { --cell: 40px; display: grid; grid-template-columns: repeat(8, var(--cell)); width: calc(var(--cell) * 8); border: 6px solid #6b4a2b; border-radius: 6px; margin: 0 auto; position: relative; }
  .board div { width: var(--cell); height: var(--cell); }
  .board div:nth-child(16n+1), .board div:nth-child(16n+3), .board div:nth-child(16n+5), .board div:nth-child(16n+7),
  .board div:nth-child(16n+10), .board div:nth-child(16n+12), .board div:nth-child(16n+14), .board div:nth-child(16n+16) { background: #f0d9b5; }
  .board div { background: #b58863; }
  .tok { position: absolute; width: var(--cell); height: var(--cell); display: grid; place-items: center; }
  .tok .ring { position: absolute; left: 10%; right: 10%; bottom: 6%; height: 34%; border-radius: 50%; border: 3px solid var(--pc); background: color-mix(in srgb, var(--pc) 30%, transparent); }
  .tok svg { width: 135%; height: 150%; position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); overflow: visible; }
  .tok .emo { font-size: calc(var(--cell) * .72); position: relative; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .tok .emo::after { content: ''; position: absolute; inset: -6%; border-radius: 50%; border: 3px solid var(--pc); }
  .caption { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 6px; }

  /* ───────── 캐릭터 공통 ───────── */
  .ch .o { stroke: #151827; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .ch .thin { stroke: #151827; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ch .pc { fill: var(--pc); }
  .ch .pc-d { fill: color-mix(in srgb, var(--pc) 70%, #000); }
  .ch g { transform-box: fill-box; }
  .ch .rig { transform-origin: 50% 100%; }
  .ch .shadow { transform-origin: center; }
  .ch .face-hurt, .ch .face-ko { display: none; }
  .ch.st-hit .face-normal, .ch.st-ko .face-normal { display: none; }
  .ch.st-hit .face-hurt { display: inline; }
  .ch.st-ko .face-ko { display: inline; }
  .ch .flash, .ch .proj { opacity: 0; }

  /* 가만히: 숨쉬듯 들썩 */
  .ch.st-idle .rig { animation: bob 1.8s ease-in-out infinite; }
  .ch.st-idle .shadow { animation: shadowBob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-3px) scaleY(1.015); } }
  @keyframes shadowBob { 0%, 100% { transform: scale(1); } 50% { transform: scale(.92); } }

  /* 맞음: 하얗게 번쩍 + 뒤로 밀림 */
  .ch.st-hit .rig { animation: hit .6s ease-out; }
  @keyframes hit { 0% { transform: translateX(0); filter: brightness(1); } 12% { transform: translateX(-12px) rotate(-6deg); filter: brightness(3.2); }
    30% { filter: brightness(1); } 45% { filter: brightness(2.4); } 60% { transform: translateX(-4px) rotate(-2deg); filter: brightness(1); } 100% { transform: translateX(0); } }

  /* 탈락: 빙글 돌며 쓰러짐 */
  .ch.st-ko .rig { animation: ko .9s ease-in forwards; transform-origin: 50% 95%; }
  .ch.st-ko .shadow { animation: koShadow .9s forwards; }
  @keyframes ko { 0% { transform: translate(0, 0) rotate(0); } 30% { transform: translate(0, -16px) rotate(-20deg); } 100% { transform: translate(14px, -21px) rotate(-86deg); opacity: .6; } }
  @keyframes koShadow { to { transform: scale(1.25, .8); opacity: .5; } }

  /* 승리: 두 번 점프 */
  .ch.st-win .rig { animation: win 1.1s ease-in-out; }
  @keyframes win { 0%, 50%, 100% { transform: translateY(0) scale(1, 1); } 10%, 60% { transform: translateY(2px) scale(1.06, .92); }
    28%, 78% { transform: translateY(-26px) scale(.96, 1.05); } }

  /* ── 저격: 모자 까딱 / 총 반동 + 섬광 ── */
  .sniper.st-idle .hat { animation: hatTip 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes hatTip { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(-6deg) translateY(-2px); } 92% { transform: rotate(2deg); } }
  .sniper.st-idle .scarf-tail { animation: flap 1.4s ease-in-out infinite; transform-origin: 0% 0%; }
  .sniper.st-attack .gun { animation: recoil .55s ease-out; transform-origin: 30% 50%; }
  .sniper.st-attack .rig { animation: lean .55s ease-out; }
  .sniper.st-attack .flash { animation: flash .35s ease-out; transform-origin: 0% 50%; }
  @keyframes recoil { 0% { transform: translateX(0); } 12% { transform: translateX(-9px) rotate(-7deg); } 100% { transform: translateX(0); } }
  @keyframes lean { 12% { transform: rotate(-4deg); } 100% { transform: rotate(0); } }
  @keyframes flash { 0% { opacity: 0; transform: scale(.3); } 15% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(.8); } }
  .sniper.st-win .gun { animation: raise 1.1s ease-in-out; transform-origin: 20% 50%; }
  @keyframes raise { 20%, 80% { transform: rotate(-55deg) translate(-4px, -6px); } }

  /* ── 흡혈: 망토 펄럭 / 달려들며 망토 활짝 ── */
  .vampire.st-idle .cape { animation: cape 2.2s ease-in-out infinite; transform-origin: 50% 0%; }
  @keyframes cape { 0%, 100% { transform: skewX(0) scaleX(1); } 50% { transform: skewX(-4deg) scaleX(1.04); } }
  .vampire.st-idle .eyes-red { animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 3px #ff2a4a); } }
  .vampire.st-attack .rig { animation: lunge .7s ease-in-out; }
  .vampire.st-attack .cape { animation: spread .7s ease-in-out; transform-origin: 50% 0%; }
  .vampire.st-attack .bite { animation: flash .5s ease-out .18s; transform-origin: 50% 50%; }
  @keyframes lunge { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px) scale(.96); } 45% { transform: translateX(22px) rotate(8deg); } 70% { transform: translateX(4px); } }
  @keyframes spread { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(1.6) scaleY(1.08); } }
  .vampire.st-win .cape { animation: spread 1.1s ease-in-out; transform-origin: 50% 0%; }

  /* ── 부메랑: 손에서 빙글 / 던졌다 받기 ── */
  .boomer.st-idle .held { animation: twirl 1.6s ease-in-out infinite; transform-origin: 20% 80%; }
  @keyframes twirl { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
  .boomer.st-idle .tails { animation: flap 1.1s ease-in-out infinite; transform-origin: 100% 0%; }
  @keyframes flap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }
  .boomer.st-attack .arm-throw { animation: throw 1.3s ease-in-out; transform-origin: 15% 15%; }
  .boomer.st-attack .held { animation: hideHeld 1.3s linear; }
  .boomer.st-attack .proj { animation: fly 1.3s ease-in-out; transform-origin: 50% 50%; }
  @keyframes throw { 0%, 100% { transform: rotate(0); } 12% { transform: rotate(-70deg); } 24% { transform: rotate(40deg); } 88% { transform: rotate(40deg); } }
  @keyframes hideHeld { 0%, 20% { opacity: 1; } 21%, 86% { opacity: 0; } 87%, 100% { opacity: 1; } }
  @keyframes fly { 0%, 20% { opacity: 0; transform: translate(0, 0) rotate(0); } 21% { opacity: 1; }
    52% { transform: translate(64px, -46px) rotate(720deg); } 86% { opacity: 1; transform: translate(0, 0) rotate(1440deg); } 87%, 100% { opacity: 0; } }
  .boomer.st-win .arm-throw { animation: raiseB 1.1s ease-in-out; transform-origin: 15% 15%; }
  @keyframes raiseB { 20%, 80% { transform: rotate(-120deg); } }
</style>
</head>
<body>
<main>
  <h1>🎨 캐릭터 샘플 3종</h1>
  <p class="sub">코드로 그린 벡터 캐릭터 (2등신 SD). 머리·몸·팔·무기를 따로 그려서 부위별로 움직여요.<br>
    버튼으로 동작을 바꿔 보고, 색을 눌러 플레이어 색이 어디에 들어가는지 확인해 보세요. 맨 아래는 실제 게임 판 크기(휴대폰 기준)예요.</p>

  <div class="grid" id="cards"></div>

  <section class="board-sec">
    <h2>📱 게임 판 크기로 보기</h2>
    <div class="boards">
      <div><div class="board" id="boardNew"></div><p class="caption">새 캐릭터 (한 칸 40px)</p></div>
      <div><div class="board" id="boardOld"></div><p class="caption">지금 (동물 이모지)</p></div>
    </div>
  </section>
</main>

<script>
const OUT = 'class="o"';
// ───────── 공통 부위 ─────────
const shadow = `<ellipse class="shadow" cx="60" cy="133" rx="27" ry="6" fill="rgba(0,0,0,.35)"/>`;
const legs = pants => `<rect ${OUT} x="45" y="110" width="13" height="18" rx="5" fill="${pants}"/><rect ${OUT} x="62" y="110" width="13" height="18" rx="5" fill="${pants}"/>`;
const faces = (eye = '#151827', extra = '') => `
  <g class="face-normal">
    <ellipse cx="50" cy="60" rx="3.4" ry="4.4" fill="${eye}"/><ellipse cx="70" cy="60" rx="3.4" ry="4.4" fill="${eye}"/>
    <circle cx="51.2" cy="58.4" r="1.2" fill="#fff"/><circle cx="71.2" cy="58.4" r="1.2" fill="#fff"/>
    ${extra}
  </g>
  <g class="face-hurt" fill="none" stroke="#151827" stroke-width="2.6" stroke-linecap="round">
    <path d="M46 56 L53 60 L46 64"/><path d="M74 56 L67 60 L74 64"/><path d="M54 72 Q60 68 66 72"/>
  </g>
  <g class="face-ko" fill="none" stroke="#151827" stroke-width="2.6" stroke-linecap="round">
    <path d="M46 56 L54 64 M54 56 L46 64"/><path d="M66 56 L74 64 M74 56 L66 64"/><path d="M55 72 Q60 70 65 72"/>
  </g>`;
const blush = `<ellipse cx="44" cy="68" rx="4.5" ry="2.6" fill="#ff8fa3" opacity=".45"/><ellipse cx="76" cy="68" rx="4.5" ry="2.6" fill="#ff8fa3" opacity=".45"/>`;

// ───────── 🎯 저격: 챙 넓은 모자 + 스카프 + 긴 저격총 ─────────
const sniper = () => `
<svg class="ch sniper st-idle" viewBox="-10 0 140 140">
  ${shadow}
  <g class="rig">
    ${legs('#3b3f55')}
    <rect ${OUT} x="40" y="80" width="40" height="36" rx="14" fill="#6b7f3a"/>
    <path d="M52 82 L60 100 L68 82" fill="#566a2c" class="thin"/>
    <g class="scarf"><path class="o pc" d="M42 80 Q60 90 78 80 L78 88 Q60 97 42 88 Z"/>
      <g class="scarf-tail"><path class="o pc" d="M44 86 L36 104 L44 102 L48 90 Z"/></g></g>
    <circle ${OUT} cx="60" cy="58" r="27" fill="#ffd9b8"/>
    ${blush}
    ${faces('#151827', `<path d="M56 71 Q60 74 64 71" fill="none" stroke="#151827" stroke-width="2.2" stroke-linecap="round"/>`)}
    <g class="hat">
      <path ${OUT} d="M40 40 L45 18 Q60 12 75 18 L80 40 Z" fill="#8a5a2b"/>
      <path class="o pc" d="M42.5 25 L77.5 25 L79 33 L41 33 Z"/>
      <ellipse ${OUT} cx="60" cy="40" rx="42" ry="8.5" fill="#9b6834"/>
      <path d="M26 40 Q60 47 94 40" fill="none" stroke="#6e4520" stroke-width="2"/>
    </g>
    <g class="gun">
      <path ${OUT} d="M34 92 L60 88 L64 100 L40 104 Q32 100 34 92 Z" fill="#8a5a2b"/>
      <rect ${OUT} x="58" y="88" width="62" height="6" rx="2" fill="#2e3242"/>
      <rect ${OUT} x="66" y="80" width="22" height="7" rx="3" fill="#3b4058"/>
      <circle cx="88" cy="83.5" r="2.4" fill="#7fd1ff"/>
      <circle ${OUT} cx="64" cy="98" r="5.5" fill="#ffd9b8"/>
      <g class="flash"><path d="M122 91 L134 84 L130 91 L138 93 L130 95 L134 102 Z" fill="#ffe14d" stroke="#ff9f43" stroke-width="1.5"/></g>
    </g>
  </g>
</svg>`;

// ───────── 🧛 흡혈: 높은 깃 망토 (안감이 플레이어 색) + 빨간 눈 + 송곳니 ─────────
const vampire = () => `
<svg class="ch vampire st-idle" viewBox="-10 0 140 140">
  ${shadow}
  <g class="rig">
    <g class="cape">
      <path ${OUT} d="M38 76 Q20 104 26 130 L94 130 Q100 104 82 76 Z" fill="#1d1830"/>
      <path class="pc" d="M42 80 Q28 104 33 126 L87 126 Q92 104 78 80 Z" opacity=".95"/>
    </g>
    ${legs('#1d1830')}
    <rect ${OUT} x="40" y="80" width="40" height="36" rx="14" fill="#2a2140"/>
    <path ${OUT} d="M52 81 L60 96 L68 81 Z" fill="#f4f1ff"/>
    <path ${OUT} d="M55 87 L60 92 L65 87 L60 84 Z" fill="#c21d3a"/>
    <path ${OUT} d="M28 44 L40 70 L50 76 Z M92 44 L80 70 L70 76 Z" fill="#1d1830"/>
    <circle ${OUT} cx="60" cy="58" r="27" fill="#efe6ff"/>
    <path ${OUT} d="M33 56 Q34 30 60 30 Q86 30 87 56 Q80 46 70 44 L60 54 L50 44 Q40 46 33 56 Z" fill="#241b3a"/>
    <g class="eyes-red">${faces('#e0314b', `<path d="M54 70 Q60 74 66 70" fill="none" stroke="#151827" stroke-width="2.2" stroke-linecap="round"/><path d="M56 71 L57.5 75 L59 71.6 Z M61 71.6 L62.5 75 L64 71 Z" fill="#fff" stroke="#151827" stroke-width="1"/>`)}</g>
    <circle ${OUT} cx="42" cy="104" r="5" fill="#efe6ff"/><circle ${OUT} cx="78" cy="104" r="5" fill="#efe6ff"/>
    <g class="flash bite"><path d="M104 66 L112 58 L110 68 L122 64 L112 72 L118 80 L106 74 Z" fill="#ff3b5c" stroke="#7a0f22" stroke-width="1.5"/></g>
  </g>
</svg>`;

// ───────── 🪃 부메랑: 삐죽 머리 + 머리띠 (플레이어 색) + 나무 부메랑 ─────────
const boom = (cls = '') => `<g class="${cls}"><path class="o" d="M0 0 L20 -4 Q24 -3 22 1 L8 4 L4 18 Q2 22 -2 18 Z" fill="#c98b3c"/><path d="M3 2 L16 -1 M3 3 L1 14" stroke="#8a5a2b" stroke-width="2" stroke-linecap="round"/></g>`;
const boomer = () => `
<svg class="ch boomer st-idle" viewBox="-10 0 140 140">
  ${shadow}
  <g class="rig">
    ${legs('#4a5a7a')}
    <rect ${OUT} x="40" y="80" width="40" height="36" rx="14" fill="#2f9e8f"/>
    <path ${OUT} d="M40 90 Q40 80 50 80 L56 80 L56 116 L46 116 Q40 116 40 108 Z M80 90 Q80 80 70 80 L64 80 L64 116 L74 116 Q80 116 80 108 Z" fill="#b8864a"/>
    <circle ${OUT} cx="42" cy="100" r="5.5" fill="#f2c79b"/>
    <circle ${OUT} cx="60" cy="58" r="27" fill="#f2c79b"/>
    <path ${OUT} d="M34 52 L30 36 L42 42 L44 26 L54 38 L60 22 L66 38 L76 26 L78 42 L90 36 L86 52 Q60 40 34 52 Z" fill="#c9702a"/>
    <g class="band"><path class="o pc" d="M34 48 Q60 40 86 48 L86 55 Q60 47 34 55 Z"/>
      <g class="tails"><path class="o pc" d="M34 50 L20 46 L24 52 L18 58 L34 55 Z"/></g></g>
    ${blush}
    <g fill="#b0602a" opacity=".6"><circle cx="46" cy="67" r="1"/><circle cx="49" cy="69" r="1"/><circle cx="71" cy="69" r="1"/><circle cx="74" cy="67" r="1"/></g>
    ${faces('#151827', `<path d="M55 71 Q60 76 66 71" fill="#fff" stroke="#151827" stroke-width="2.2" stroke-linejoin="round"/>`)}
    <g class="arm-throw">
      <rect ${OUT} x="74" y="84" width="10" height="20" rx="5" fill="#2f9e8f"/>
      <circle ${OUT} cx="80" cy="104" r="5.5" fill="#f2c79b"/>
      <g transform="translate(78 98)">${boom('held')}</g>
    </g>
    <g transform="translate(82 94)">${boom('proj')}</g>
  </g>
</svg>`;

const CHARS = [
  { key: 'sniper', icon: '🎯', name: '저격', sub: '챙 넓은 모자 · 스카프 · 긴 총', make: sniper, color: '#ff5a5f',
    note: '가만히: 가끔 모자를 까딱 · 공격: 총 반동 + 총구 섬광 · 승리: 총을 치켜듦' },
  { key: 'vampire', icon: '🧛', name: '흡혈', sub: '높은 깃 망토 · 빨간 눈 · 송곳니', make: vampire, color: '#4d8dff',
    note: '가만히: 망토 펄럭 + 눈빛 · 공격: 달려들며 망토를 활짝 · 승리: 망토 펼치기' },
  { key: 'boomer', icon: '🪃', name: '부메랑', sub: '삐죽 머리 · 머리띠 · 나무 부메랑', make: boomer, color: '#35d07f',
    note: '가만히: 손에서 빙글 + 머리띠 휘날림 · 공격: 던졌다가 돌아오면 받기 · 승리: 부메랑 번쩍' },
];
const COLORS = ['#ff5a5f', '#4d8dff', '#35d07f', '#b57bff', '#ffc53d'];
const STATES = [['idle', '가만히'], ['attack', '공격'], ['hit', '맞음'], ['ko', '탈락'], ['win', '승리']];
const ONE_SHOT = { attack: 1400, hit: 650, win: 1150 };

const cards = document.getElementById('cards');
CHARS.forEach(c => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<h2>${c.icon} ${c.name} <small>${c.sub}</small></h2>
    <div class="stage" style="--pc:${c.color}">${c.make()}</div>
    <div class="btns">${STATES.map(([k, t]) => `<button data-st="${k}" class="${k === 'idle' ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div class="colors">플레이어 색 ${COLORS.map(col => `<i data-c="${col}" style="background:${col}" class="${col === c.color ? 'on' : ''}"></i>`).join('')}</div>
    <p class="note">${c.note}</p>`;
  cards.appendChild(el);
  const svg = el.querySelector('svg'), stage = el.querySelector('.stage');
  let timer = null;
  const set = st => {
    clearTimeout(timer);
    svg.classList.remove(...STATES.map(s => 'st-' + s[0]));
    void svg.getBoundingClientRect();           // 같은 동작을 연달아 눌러도 다시 재생
    svg.classList.add('st-' + st);
    el.querySelectorAll('[data-st]').forEach(b => b.classList.toggle('on', b.dataset.st === st));
    if (ONE_SHOT[st]) timer = setTimeout(() => set('idle'), ONE_SHOT[st]);
  };
  el.querySelectorAll('[data-st]').forEach(b => { b.onclick = () => set(b.dataset.st); });
  el.querySelectorAll('[data-c]').forEach(i => {
    i.onclick = () => { stage.style.setProperty('--pc', i.dataset.c); el.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === i)); };
  });
});

// ───────── 게임 판 크기 비교 ─────────
const boardNew = document.getElementById('boardNew'), boardOld = document.getElementById('boardOld');
[boardNew, boardOld].forEach(b => { for (let i = 0; i < 64; i++) b.appendChild(document.createElement('div')); });
const spots = [[1, 5], [5, 2], [6, 6]];
const ANIMALS = ['🦊', '🐧', '🐸'];
CHARS.forEach((c, i) => {
  const [x, y] = spots[i];
  const t = document.createElement('div');
  t.className = 'tok'; t.style.cssText = `left:calc(var(--cell)*${x});top:calc(var(--cell)*${y});--pc:${c.color}`;
  t.innerHTML = `<div class="ring"></div>${c.make()}`;
  boardNew.appendChild(t);
  const o = document.createElement('div');
  o.className = 'tok'; o.style.cssText = `left:calc(var(--cell)*${x});top:calc(var(--cell)*${y});--pc:${c.color}`;
  o.innerHTML = `<span class="emo">${ANIMALS[i]}</span>`;
  boardOld.appendChild(o);
});
</script>
</body>
</html>
